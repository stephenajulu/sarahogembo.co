baseURL = 'https://sarahogembo.com/'
languageCode = 'en-US'
title = 'Sarah Ogembo | Corporate Master of Ceremonies & Executive Moderator'
enableRobotsTXT = true

[build]
  writeStats = true

[minify]
  minifyOutput = true
  disableCSS = false
  disableJS = false
  disableHTML = false
  disableXML = false
  disableSVG = false

[sitemap]
  changefreq = 'weekly'
  priority = 0.8
  filename = 'sitemap.xml'

[privacy]
  [privacy.youtube]
    privacyEnhanced = true

[security]
  [security.funcs]
    getenv = ['^HUGO_']

[params]
  author = "Sarah Ogembo"
  title = "Sarah Ogembo | Corporate Master of Ceremonies & Executive Moderator"
  tagline = "Engaging Audiences · Amplifying Purpose · Leaving Lasting Impressions"
  role = "Corporate Communications & Audience Engagement Professional • Executive Moderator"
  description = "Sarah Ogembo is a corporate communications and audience engagement professional, conference moderator, and executive event facilitator in Nairobi, Kenya. Delivering seamless, impactful experiences across East Africa and globally."
  keywords = "Sarah Ogembo, Corporate Communications Professional Nairobi, Corporate MC Kenya, Conference Moderator East Africa, Executive Summit Facilitator, Audience Engagement Kenya, Panel Moderator Nairobi"
  phone = "+254 719 411 433"
  phone_display = "+254 719 411 433"
  email = "nyabokeogembo@gmail.com"
  email_alt = "hello@sarahogembo.com"
  location = "Nairobi, Kenya"
  geo_region = "KE-30"
  geo_placename = "Nairobi, Kenya"
  geo_position = "-1.2921;36.8219"
  icbm = "-1.2921, 36.8219"
  linkedin = "https://www.linkedin.com/in/sarah-ogembo"
  instagram = "https://www.instagram.com/ogembo.s"
  whatsapp = "https://wa.me/254719411433?text=Hello%20Sarah,%20I%20would%20like%20to%20discuss%20collaborating%20with%20you%20for%20an%20event."
  og_image = "/images/og-image.jpg"

