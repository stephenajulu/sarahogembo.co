{{ $settings := hugo.Data.settings }}

<!-- Accessible Skip to Main Content Link (WCAG 2.1 AAA Success Criterion 2.4.1) -->
<a href="#main-content" class="skip-to-content">Skip to main content</a>

<!-- Top Glass Navigation Bar -->
<header class="site-header" role="banner">
  <div class="container nav-wrapper">
    <a href="/" class="brand-logo" aria-label="Sarah Ogembo - Return to Homepage">
      <picture>
        <source srcset="/images/logos/logo-so-crest.webp" type="image/webp">
        <img src="/images/logos/logo-so-crest.png" alt="Sarah Ogembo Monogram Crest" class="brand-monogram-img" width="46" height="46">
      </picture>
      <div class="brand-meta">
        <span class="brand-name">{{ $settings.brand.name | default "SARAH OGEMBO" }}</span>
        <span class="brand-tagline">{{ $settings.brand.tagline | default "PEOPLE • CONVERSATIONS • IMPACT" }}</span>
      </div>
    </a>

    <!-- Desktop & Mobile Navigation Links -->
    <nav id="site-navigation" class="nav-menu" role="navigation" aria-label="Primary Navigation">
      <div class="nav-links">
        {{ range .Site.Menus.main }}
          <a href="{{ .URL }}" class="nav-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}">{{ .Name }}</a>
        {{ end }}
      </div>

      <!-- Quick Actions for Mobile Drawer -->
      <div class="nav-mobile-actions">
        <a href="/#contact" class="btn btn-primary btn-block">Book Sarah</a>
        <a href="{{ $settings.social_links.whatsapp | default "https://wa.me/254719411433" }}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary btn-block nav-drawer-whatsapp">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="margin-right: 6px;">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
          </svg>
          Chat on WhatsApp
        </a>
      </div>
    </nav>

    <!-- Action Button & Mobile Hamburger Toggle -->
    <div class="header-actions">
      <a href="/#contact" class="btn-book-nav">Book Sarah</a>
      <button class="mobile-toggle" aria-label="Toggle navigation menu" aria-controls="site-navigation" aria-expanded="false" type="button">
        <span class="hamburger-line line-1"></span>
        <span class="hamburger-line line-2"></span>
        <span class="hamburger-line line-3"></span>
      </button>
    </div>
  </div>
  <!-- Mobile Drawer Backdrop Overlay -->
  <div class="nav-backdrop" aria-hidden="true"></div>
</header>
