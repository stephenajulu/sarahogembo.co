# ==============================================================================
# RENDER BLUEPRINT SPECIFICATION (render.yaml)
# Project: Sarah Ogembo Personal Brand (sarahogembo.co)
# Platform: Render Static Site (Zero-Config 1-Tap Deployment)
# ==============================================================================

services:
  - type: web
    name: sarahogembo-co
    runtime: static
    buildCommand: hugo --gc --minify
    staticPublishPath: public
    pullRequestPreviewsEnabled: true
    envVars:
      - key: HUGO_VERSION
        value: 0.160.1
      - key: HUGO_ENV
        value: production
      - key: HUGO_ENABLEGITINFO
        value: "true"

    # HTTP Security, PWA, Caching & Performance Headers
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' blob:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' https://cloudflareinsights.com; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self' https://wa.me;"

      # Service Worker (Never cache)
      - path: /sw.js
        name: Content-Type
        value: application/javascript; charset=utf-8
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

      # PWA Webmanifest
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json; charset=utf-8
      - path: /manifest.webmanifest
        name: Cache-Control
        value: public, max-age=604800

      # Fingerprinted Styles & Scripts (1 Year Immutable)
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # Media Assets (Images, Videos)
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /videos/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # Downloads (PDF, Docx)
      - path: /downloads/*
        name: Cache-Control
        value: public, max-age=604800, must-revalidate

    # Canonical 301 Permanent Redirects
    routes:
      - type: redirect
        source: /resume
        destination: /cv/
      - type: redirect
        source: /resume/
        destination: /cv/
      - type: redirect
        source: /credentials
        destination: /cv/
      - type: redirect
        source: /credentials/
        destination: /cv/
      - type: redirect
        source: /profile
        destination: /cv/
      - type: redirect
        source: /profile/
        destination: /cv/
