<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Notice | Sarah Ogembo</title>
  <meta name="theme-color" content="#0A0A0A">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0A0A0A;
      color: #E2DFD9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      max-width: 520px;
      background: #151515;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      padding: 40px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .crest-img {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      display: block;
    }
    .eyebrow {
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #D4AF37;
      margin-bottom: 12px;
      font-weight: 600;
    }
    h1 {
      font-size: 1.85rem;
      color: #FBFBFB;
      margin-bottom: 14px;
      font-family: Georgia, serif;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #B5B0A6;
      margin-bottom: 24px;
    }
    .contact-box {
      background: #1C1C1C;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 28px;
      text-align: left;
    }
    .contact-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    .contact-line:last-child { margin-bottom: 0; }
    .contact-label { color: #D4AF37; font-weight: 600; }
    .contact-val a { color: #FBFBFB; text-decoration: none; }
    .contact-val a:hover { color: #D4AF37; text-decoration: underline; }
    .btn-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #D4AF37;
      color: #0A0A0A;
      border: 1px solid #D4AF37;
    }
    .btn-primary:hover { background: #F7E7A9; }
    .btn-secondary {
      background: transparent;
      color: #FBFBFB;
      border: 1px solid rgba(212, 175, 55, 0.4);
    }
    .btn-secondary:hover { border-color: #D4AF37; color: #D4AF37; }
  </style>
</head>
<body>
  <div class="offline-card" role="main">
    <img src="/images/logos/logo-so-crest.png" alt="Sarah Ogembo Crest" class="crest-img" width="70" height="70">
    <div class="eyebrow">OFFLINE MODE</div>
    <h1>You are Currently Offline</h1>
    <p>It looks like your internet connection is unavailable. Don't worry, Sarah Ogembo's cached credentials and key contact channels are ready below.</p>

    <div class="contact-box">
      <div class="contact-line">
        <span class="contact-label">Direct Line:</span>
        <span class="contact-val"><a href="tel:+254719411433">+254 719 411 433</a></span>
      </div>
      <div class="contact-line">
        <span class="contact-label">Email:</span>
        <span class="contact-val"><a href="mailto:hello@sarahogembo.com">hello@sarahogembo.com</a></span>
      </div>
      <div class="contact-line">
        <span class="contact-label">Location:</span>
        <span class="contact-val">Nairobi, Kenya</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="window.location.reload()">Retry Connection</button>
      <a href="/cv/" class="btn btn-secondary">View Cached CV</a>
      <a href="/" class="btn btn-secondary">Go to Homepage</a>
    </div>
  </div>
</body>
</html>
